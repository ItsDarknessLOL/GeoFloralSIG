<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa - Plantas Medicinales del Sureste</title>
  <meta name="description" content="Mapa interactivo de distribución de plantas medicinales endémicas.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    
    /* Mapa full screen */
    .mapa-fullscreen {
      position: fixed;
      top: var(--header-altura);
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
    }
    
    #mapaPrincipal {
      width: 100%;
      height: 100%;
    }
    
    /* Panel de filtros */
    .mapa-filtros {
      position: fixed;
      top: calc(var(--header-altura) + 16px);
      left: 16px;
      z-index: 1000;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(15px);
      border-radius: var(--borde-radio-lg);
      padding: 16px;
      box-shadow: var(--sombra-media);
      max-width: 280px;
      max-height: calc(100vh - var(--header-altura) - 80px);
      overflow-y: auto;
      transition: transform 0.3s ease;
    }
    
    .mapa-filtros.collapsed {
      transform: translateX(calc(-100% - 20px));
    }
    
    .mapa-filtros-toggle {
      position: fixed;
      top: calc(var(--header-altura) + 16px);
      left: 16px;
      z-index: 1001;
      width: 44px;
      height: 44px;
      background: var(--color-estado);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 1.25rem;
      cursor: pointer;
      box-shadow: var(--sombra-media);
      display: none;
      align-items: center;
      justify-content: center;
    }
    
    .mapa-filtros h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .filtro-mapa-group {
      margin-bottom: 12px;
    }
    
    .filtro-mapa-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gris-oscuro);
      margin-bottom: 4px;
    }
    
    .filtro-mapa-group select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: var(--borde-radio);
      font-size: 0.85rem;
    }
    
    /* Iconos de filtros */
    .filtro-iconos {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    
    .filtro-icono-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 10px;
      background: var(--blanco);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 20px;
      font-size: 0.75rem;
      cursor: pointer;
      transition: var(--transicion-suave);
    }
    
    .filtro-icono-btn:hover {
      background: var(--color-estado-muy-claro);
      border-color: var(--color-estado);
    }
    
    .filtro-icono-btn.activo {
      background: var(--color-estado);
      color: var(--blanco);
      border-color: var(--color-estado);
    }
    
    /* Leyenda */
    .mapa-leyenda {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(15px);
      border-radius: var(--borde-radio);
      padding: 16px;
      box-shadow: var(--sombra-media);
      font-size: 0.8rem;
    }
    
    .leyenda-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    
    .leyenda-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }
    
    /* Buscador flotante */
    .mapa-buscador {
      position: fixed;
      top: calc(var(--header-altura) + 16px);
      right: 16px;
      z-index: 1000;
      width: 280px;
    }
    
    .mapa-buscador input {
      width: 100%;
      padding: 10px 14px 10px 40px;
      border: none;
      border-radius: 50px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(15px);
      box-shadow: var(--sombra-media);
      font-size: 0.9rem;
    }
    
    .mapa-buscador-icono {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.5;
    }
    
    /* Hint Ctrl */
    .mapa-hint {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 10px 20px;
      background: rgba(0,0,0,0.75);
      color: white;
      border-radius: 50px;
      font-size: 0.85rem;
      backdrop-filter: blur(10px);
      animation: fadeInUp 0.5s ease;
      pointer-events: none;
    }
    
    /* Botón móvil */
    #btnMapaMovil {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      padding: 14px 28px;
      background: var(--color-estado);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: var(--sombra-fuerte);
      cursor: pointer;
    }
    
    @media (max-width: 768px) {
      .mapa-filtros {
        max-width: 240px;
        top: calc(var(--header-altura) + 60px);
      }
      
      .mapa-buscador {
        width: calc(100% - 160px);
        right: 80px;
      }
      
      .mapa-leyenda {
        display: none;
      }
      
      #btnMapaMovil {
        display: block;
      }
    }
    
    @media (max-width: 480px) {
      .mapa-filtros {
        max-width: calc(100vw - 32px);
        left: 16px;
        right: 16px;
      }
      
      .mapa-buscador {
        width: calc(100% - 32px);
        left: 16px;
        right: 16px;
      }
    }
    
    /* Popup personalizado */
    .popup-planta .leaflet-popup-content-wrapper {
      border-radius: var(--borde-radio);
      box-shadow: var(--sombra-media);
    }
    
    .popup-planta h4 {
      margin: 0 0 4px;
      font-size: 1rem;
    }
    
    .popup-planta .cientifico {
      font-style: italic;
      color: var(--color-estado);
      font-size: 0.85rem;
      margin-bottom: 6px;
    }
    
    .popup-planta .estado-tag {
      display: inline-block;
      padding: 2px 8px;
      background: var(--color-estado-muy-claro);
      color: var(--color-estado);
      border-radius: 12px;
      font-size: 0.7rem;
      margin-bottom: 6px;
    }
    
    /* Custom scrollbar */
    .mapa-filtros::-webkit-scrollbar {
      width: 4px;
    }
    
    .mapa-filtros::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.2);
      border-radius: 2px;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="contenedor">
      <a href="../index.html" class="logo">
        <div class="logo-icono">🌿</div>
        <span>Plantas Medicinales del Sureste</span>
      </a>
      
      <nav class="nav">
        <a href="../index.html">Inicio</a>
        <a href="catalogo.html">Catálogo</a>
        <a href="mapa.html" class="activo">Mapa</a>
        <a href="herramientas.html">Herramientas</a>
        <a href="acerca_de.html">Acerca de</a>
      </nav>
      
      <button class="menu-toggle" aria-label="Menú">☰</button>
    </div>
  </header>

  <!-- Mapa -->
  <div class="mapa-fullscreen">
    <div id="mapaPrincipal"></div>
  </div>

  <!-- Panel de filtros -->
  <div class="mapa-filtros" id="filtrosPanel">
    <h3>🗺️ Capas</h3>
    
    <div class="filtro-mapa-group">
      <label>Mapa base</label>
      <div class="filtro-iconos">
        <button class="filtro-icono-btn activo" data-capa="osm" onclick="cambiarCapaBase('osm')">🗺️ OSM</button>
        <button class="filtro-icono-btn" data-capa="satelital" onclick="cambiarCapaBase('satelital')">🛰️ Sat</button>
        <button class="filtro-icono-btn" data-capa="oscuro" onclick="cambiarCapaBase('oscuro')">🌑 Oscuro</button>
        <button class="filtro-icono-btn" data-capa="topo" onclick="cambiarCapaBase('topo')">⛰️ Topo</button>
      </div>
    </div>
    
    <div class="filtro-mapa-group">
      <label>Estados</label>
      <div class="filtro-iconos">
        <button class="filtro-icono-btn activo" data-poligono="todos" onclick="togglePoligonos('todos')">Todos</button>
        <button class="filtro-icono-btn" data-poligono="yucatan" onclick="togglePoligonos('yucatan')">YUC</button>
        <button class="filtro-icono-btn" data-poligono="qroo" onclick="togglePoligonos('qroo')">QROO</button>
        <button class="filtro-icono-btn" data-poligono="campeche" onclick="togglePoligonos('campeche')">CAM</button>
        <button class="filtro-icono-btn" data-poligono="chiapas" onclick="togglePoligonos('chiapas')">CHIS</button>
        <button class="filtro-icono-btn" data-poligono="tabasco" onclick="togglePoligonos('tabasco')">TAB</button>
        <button class="filtro-icono-btn" data-poligono="veracruz" onclick="togglePoligonos('veracruz')">VER</button>
      </div>
    </div>
    
    <div class="filtro-mapa-group">
      <label>Visualización</label>
      <div class="filtro-iconos">
        <button class="filtro-icono-btn activo" data-visual="puntos" onclick="toggleVisual('puntos')">📍 Puntos</button>
        <button class="filtro-icono-btn activo" data-visual="poligonos" onclick="toggleVisual('poligonos')">⬡ Polígonos</button>
        <button class="filtro-icono-btn" data-visual="heatmap" onclick="toggleVisual('heatmap')">🔥 Calor</button>
      </div>
    </div>
    
    <div class="filtro-mapa-group">
      <label>Especies</label>
      <select id="filtroEspecieMapa" onchange="filtrarEspecieMapa()">
        <option value="">Todas las especies</option>
      </select>
    </div>
  </div>

  <!-- Buscador -->
  <div class="mapa-buscador">
    <span class="mapa-buscador-icono">🔍</span>
    <input type="text" id="buscadorMapa" placeholder="Buscar planta..." oninput="buscarEnMapa(this.value)">
  </div>

  <!-- Leyenda -->
  <div class="mapa-leyenda">
    <strong style="display: block; margin-bottom: 8px;">Estados</strong>
    <div class="leyenda-item"><div class="leyenda-color" style="background: #2E7D32;"></div>Yucatán</div>
    <div class="leyenda-item"><div class="leyenda-color" style="background: #C62828;"></div>Quintana Roo</div>
    <div class="leyenda-item"><div class="leyenda-color" style="background: #1565C0;"></div>Campeche</div>
    <div class="leyenda-item"><div class="leyenda-color" style="background: #6A1B9A;"></div>Chiapas</div>
    <div class="leyenda-item"><div class="leyenda-color" style="background: #E65100;"></div>Tabasco</div>
    <div class="leyenda-item"><div class="leyenda-color" style="background: #00695C;"></div>Veracruz</div>
  </div>

  <!-- Hint -->
  <div class="mapa-hint" id="mapaHint" style="display: none;">
    🖱️ Presiona <strong>Ctrl</strong> + clic para mover el mapa
  </div>

  <!-- Botón móvil -->
  <button id="btnMapaMovil" onclick="toggleMapaMovil()">🔓 Desbloquear mapa</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/mapa.js"></script>
</body>
</html>
